# BC Backup — CI
# - Toda PR / push na main: typecheck, lint, testes (2 fusos), E2E com Electron sob xvfb e o instalador do Windows.
# - Tag v* (ex.: v0.2.0): além disso, cria/atualiza a Release do GitHub com o instalador anexado.
# - Disparo manual (Actions → build → Run workflow) com "prerelease" preenchido: publica um pré-lançamento
#   com link direto para o instalador (só se o teste no Windows passar).
# Versões das actions conferidas em 04/10/2026: checkout v7, setup-node v7, cache v6, upload-artifact v7,
# download-artifact v8, softprops/action-gh-release v3 (runtime Node 24).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publicar um pré-lançamento com esta versão (ex.: v0.1.0-beta.1). Vazio = só o artefato.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Testes (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci # o postinstall baixa o Electron (cache em ~/.cache/electron)

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários (UTC)
        run: npm test

      - name: Testes unitários (America/New_York, pega erros de horário de verão)
        run: npm test
        env:
          TZ: America/New_York

      - name: Bibliotecas de sistema do Electron (nss, gbm, asound…) e xvfb
        run: npx playwright install-deps chromium

      - name: Permitir o sandbox do Chromium/Electron (AppArmor do Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: E2E (build + Playwright com Electron sob xvfb)
        run: xvfb-run -a npm run e2e

      - name: Relatório do Playwright (só em falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Instalador do Windows
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache do Electron e das ferramentas do electron-builder (NSIS, rcedit)
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: eb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: eb-${{ runner.os }}-

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador NSIS (x64)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # sem assinatura por enquanto

      - name: Publicar o instalador como artefato
        uses: actions/upload-artifact@v7
        with:
          name: BC-Backup-Setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      # O app empacotado roda de verdade no Windows: unidades (PowerShell), caminhos com acento, pasta datada
      # e ZIP com verificação completa, arquivo bloqueado → aviso, iniciar com o Windows, telas e log sem erros.
      - name: Teste no Windows (app empacotado)
        run: npx playwright test e2e/windows.spec.ts
        env:
          BC_E2E_EXE: dist/win-unpacked/BCBackup.exe

      - name: Screenshots e relatório do teste no Windows
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-teste
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Release do GitHub
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.prerelease != '')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # criar a Release e anexar arquivos
    steps:
      - name: Baixar o instalador
        uses: actions/download-artifact@v8
        with:
          name: BC-Backup-Setup
          path: dist

      - name: Criar/atualizar a Release com o instalador
        uses: softprops/action-gh-release@v3
        with:
          # Tag enviada (push) ou, no disparo manual, a versão informada (a tag é criada neste commit).
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: BC Backup ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || github.ref_name }}
          files: dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          append_body: true
          body: |
            ## Como instalar
            1. Baixe o arquivo **BC-Backup-Setup-….exe** logo abaixo, em *Assets*.
            2. Abra o instalador. Como ele ainda não tem assinatura digital, o Windows pode mostrar
               "O Windows protegeu o computador": clique em **Mais informações → Executar assim mesmo**.
            3. Siga o assistente. O BC Backup abre sozinho e passa a iniciar com o Windows (na bandeja, perto do relógio).
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' || contains(github.ref_name, '-') }} # v1.0.0-beta.1 → pré-lançamento
